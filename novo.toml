[package]
name        = "bencode-nv"
version     = "0.1.0"
description = "BEP 3 bencode, both ways, with the canonical key ordering as a writer rule and a reader question rather than something silently applied.  A second reader keeps the exact byte span of every value, because a torrent's info-hash is taken over the bytes the file HAS and not over the bytes a re-encoding would produce, and a typed .torrent reader sits on top of it."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: arithmetic over bytes the caller already holds.  Every public
# function declares `[]`.  Nothing hashes: the info-hash is a SHA-1 the
# caller takes over the range this package hands it.  Nothing speaks to
# a tracker or a peer, which is `[net]` and a different package.
#
# A `creation date` is the integer the file holds, in Unix seconds, and
# is never compared against a clock.
#
# There is no `tests/embedded_probe.nv`, because the package makes no
# claim to build for a microcontroller: the value tree is one
# allocation per node, and a torrent's piece table is megabytes.
layer       = "core"

category    = "encoding"

tags        = ["bencode", "bep-3", "torrent", "bittorrent", "info-hash", "wire-format"]
repository  = "https://github.com/novolang/bencode-nv"
maintainers = ["novo-lang"]
# 0.15.0 is the toolchain this release was built and tested with.
novo        = ">= 0.15.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The encoding BitTorrent is written in, and the torrent file on top of it"

[dependencies]
# None, and the absence worth saying out loud is a hash package.
#
# A torrent's info-hash is the SHA-1 of the `info` dictionary's encoded
# bytes, and this package does not compute it.  `benctorrent.info_span`
# answers exactly which bytes to hash and the caller hands them to
# crypto-nv, whose `sha1` is the one function needed.  BEP 52's version
# 2 torrents use SHA-256 over the same span, so the same shape carries
# to them with a different call at the caller's end and no change here.
