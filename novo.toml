[package]
name        = "bencode-nv"
version     = "0.0.1"
description = "BEP 3 bencode, both ways, with the canonical key ordering as a writer rule and a reader question rather than something silently applied.  A second reader keeps the exact byte span of every value, because a torrent's info-hash is taken over the bytes the file HAS and not over the bytes a re-encoding would produce, and a typed .torrent reader sits on top of it.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`: arithmetic over bytes the caller already holds.  Every public
# function declares `[]`, and the two effects a torrent package could
# have grown are both refused.  Nothing hashes — the info-hash is a
# SHA-1 the caller takes over the span this package hands it — and
# nothing speaks to a tracker or a peer, which is `[net]` and a
# different package.
#
# A `creation date` is the integer the file holds, in Unix seconds, and
# is never compared against a clock this package reads.
#
# NO `tests/embedded_probe.nv`, and the absence is a claim not made
# rather than a claim skipped.  The value tree is one allocation per
# node and a torrent's piece table is megabytes; neither is what a
# microcontroller has.
layer       = "core"

category    = "encoding"

tags        = ["bencode", "bep-3", "torrent", "bittorrent", "info-hash", "wire-format"]
repository  = "https://github.com/novolang/bencode-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.9.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The encoding BitTorrent is written in, and the torrent file on top of it"

[dependencies]
# None, and the absence worth saying out loud is a hash package.
#
# A torrent's info-hash is the SHA-1 of the `info` dictionary's encoded
# bytes, and this package does not compute it.  `benctorrent.info_span`
# answers exactly which bytes to hash and the caller hands them to
# crypto-nv, whose `sha1` is the one function needed.  BEP 52's version
# 2 torrents use SHA-256 over the same span, so the same shape carries
# to them with a different call at the caller's end and no change here.
